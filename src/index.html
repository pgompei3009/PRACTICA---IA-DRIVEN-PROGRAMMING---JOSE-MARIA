<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación de Saludos</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor">
        <h1 id="saludo">Hola Mundo</h1>

        <input
            type="text"
            id="nombre"
            placeholder="Introduce tu nombre"
        />

        <div class="botones">
            <button id="boton-saludo">
                Saludar
            </button>

            <button id="boton-limpiar">
                Limpiar
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
